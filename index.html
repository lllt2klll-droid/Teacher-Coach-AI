<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F7FC" />
    <meta
      name="description"
      content="Teacher Coach AI – Nền tảng luyện tập giảng dạy cho sinh viên Sư phạm Tiểu học với lớp học AI, phân tích camera và giọng nói."
    />
    <title>Teacher Coach AI</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('teacher-coach-settings');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : 'light';
          var accent = raw ? (JSON.parse(raw).state || {}).accent : 'blue';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.accent = accent || 'blue';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
